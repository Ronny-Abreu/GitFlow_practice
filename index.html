<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Registro de Asistencia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header>
    <h1>Registro de Asistencia y Tardanzas</h1>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-title">Nuevo Registro</h2>
      <form id="attendance-form">
        <div class="form-group">
          <label for="student">Estudiante</label>
          <input type="text" id="student" placeholder="Nombre completo" required />
        </div>
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="status">Estado</label>
          <select id="status" required>
            <option value="">-- Seleccionar --</option>
            <option value="Presente">Presente</option>
            <option value="Ausente">Ausente</option>
            <option value="Tardanza">Tardanza</option>
          </select>
        </div>
        <button type="submit" id="submit-btn">Guardar Registro</button>
      </form>
    </section>

    <section class="table-section">
      <h2>Registros Guardados</h2>
      <table id="attendance-table">
        <thead>
          <tr>
            <th>Estudiante</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Filas renderizadas dinámicamente -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Firebase SDK via CDN (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
